# ============================================================
# E-Voting Platform — Main Application Configuration
# All secrets injected via environment variables.
# NEVER hardcode secrets in this file.
# ============================================================

spring:
  application:
    name: evoting-platform

  # ---- Datasource (Supabase PostgreSQL 17) ----
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/evoting}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SUPABASE_DB_MAX_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      pool-name: EVotingHikariPool
      # Supabase/PgBouncer in transaction mode compatibility
      auto-commit: true

  # ---- JPA / Hibernate ----
  jpa:
    database: POSTGRESQL
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_schema: public
    open-in-view: false

  # ---- Flyway Database Migrations ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8
    schemas: public

  # ---- JSP View Configuration ----
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp

  # ---- Servlet / Multipart ----
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ---- Jackson ----
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
    default-property-inclusion: non_null

  # ---- Security Headers ----
  security:
    require-ssl: false # Set true in production

# ============================================================
# Server Configuration
# ============================================================
server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false  # Set true when behind HTTPS proxy
        same-site: strict
  error:
    include-stacktrace: never
    include-message: never  # Never expose internal errors to clients
    include-binding-errors: never

# ============================================================
# E-Voting Application Properties
# ============================================================
evoting:
  # JWT Configuration — secret from environment ONLY
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-hours: ${JWT_REFRESH_EXPIRATION_HOURS:24}

  # CORS — strict, no wildcards for authenticated APIs
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

  # Blockchain / Fabric Gateway
  fabric:
    gateway-endpoint: ${FABRIC_GATEWAY_ENDPOINT:localhost:7051}
    msp-id: ${FABRIC_MSP_ID:Org2MSP}
    cert-path: ${FABRIC_CERT_PATH:/opt/fabric/certs/cert.pem}
    key-path: ${FABRIC_KEY_PATH:/opt/fabric/certs/key.pem}
    tls-cert-path: ${FABRIC_TLS_CERT_PATH:/opt/fabric/certs/tlsca.pem}
    channel: ${FABRIC_CHANNEL:election-channel}
    chaincode: ${FABRIC_CHAINCODE:evoting-contract}
    connection-timeout-seconds: 30
    proposal-timeout-seconds: 60
    endorsement-timeout-seconds: 120

  # Merkle Batching
  merkle:
    batch-size: ${MERKLE_BATCH_SIZE:100}
    anchor-interval-seconds: ${MERKLE_BATCH_ANCHOR_INTERVAL_SECONDS:300}

  # Tally Key Store
  tally:
    key-share-directory: ${TALLY_KEY_SHARE_DIRECTORY:/opt/evoting/keyshares}
    key-share-holder: ${TALLY_KEY_SHARE_HOLDER:ELECTION_AUTHORITY}

# ============================================================
# Spring Actuator (Monitoring)
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        exclude: env,beans,configprops,mappings,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  security:
    enabled: true

# ============================================================
# Logging
# ============================================================
logging:
  level:
    root: INFO
    com.evoting: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    # NEVER log: passwords, tokens, private keys, ballot content
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

# ============================================================
# OpenAPI / Swagger Documentation
# ============================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
